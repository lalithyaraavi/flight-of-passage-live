name: collect
on:
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"   # every 10 minutes; GitHub may start runs late and the pipeline measures that gap
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bronze (fetch one snapshot)
        run: python pipeline/collect.py
      - name: Silver and gold (clean, check, publish)
        run: pip install -q -r requirements.txt && python pipeline/build.py
      - name: Commit data
        run: |
          git config user.name "fop-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
