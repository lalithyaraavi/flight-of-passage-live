name: collect
on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"   # backup start; GitHub runs schedules rarely, so each run also queues the next one
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Note start time
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bronze (fetch one snapshot)
        run: python pipeline/collect.py
      - name: Silver and gold (clean, check, publish)
        run: pip install -q -r requirements.txt && python pipeline/build.py
      - name: Commit data
        run: |
          git config user.name "fop-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Queue the next run 10 minutes after this one started
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(( STARTED + 600 - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          gh workflow run collect.yml --ref main -R "$GITHUB_REPOSITORY"
